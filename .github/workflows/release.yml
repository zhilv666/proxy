# 推送 v* tag 时: 自动生成 CHANGELOG.md 并回写主分支、
# 交叉编译五个平台的二进制并打包、创建 GitHub Release。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  ZIG_VERSION: 0.15.2

jobs:
  changelog:
    name: 整理更新日志
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: 生成并回写 CHANGELOG.md
        run: |
          bash scripts/gen-changelog.sh "${GITHUB_REF_NAME}"
          if ! git diff --quiet CHANGELOG.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md
            git commit -m "docs: 更新 ${GITHUB_REF_NAME} 更新日志"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi

      - name: 生成 Release Notes
        run: bash scripts/gen-changelog.sh "${GITHUB_REF_NAME}" --notes-only > release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  build:
    name: 打包 ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-windows
          - x86_64-linux
          - aarch64-linux
          - x86_64-macos
          - aarch64-macos
    steps:
      # 完整历史 + tags: 构建时 git describe 生成版本号需要
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: 单元测试
        if: matrix.target == 'x86_64-linux'
        run: zig build test

      - name: 交叉编译
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseFast

      - name: 打包
        run: |
          NAME="proxy-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p dist
          case "${{ matrix.target }}" in
            *windows*)
              (cd zig-out/bin && zip "../../dist/${NAME}.zip" proxy.exe)
              ;;
            *)
              tar -czf "dist/${NAME}.tar.gz" -C zig-out/bin proxy
              ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: dist/*

  release:
    name: 发布 Release
    needs: [changelog, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 生成校验和
        run: |
          mkdir -p dist
          cp artifacts/bin-*/* dist/
          (cd dist && sha256sum * > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: artifacts/release-notes/release-notes.md
          files: dist/*

      - name: 更新包管理器清单 (Scoop/Homebrew)
        run: |
          bash scripts/gen-manifests.sh "${GITHUB_REF_NAME}" dist/SHA256SUMS.txt
          if ! git diff --quiet pkg 2>/dev/null || [ -n "$(git status --porcelain pkg)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pkg
            git commit -m "chore: 更新 ${GITHUB_REF_NAME} 包管理器清单"
            git pull --rebase origin "${{ github.event.repository.default_branch }}"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi

      - name: 同步 Homebrew Tap (需配置 TAP_TOKEN 密钥)
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "未配置 TAP_TOKEN，跳过 tap 同步"
            exit 0
          fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/zhilv666/homebrew-tap.git" /tmp/tap
          mkdir -p /tmp/tap/Formula
          cp pkg/homebrew/proxy.rb /tmp/tap/Formula/proxy.rb
          cd /tmp/tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/proxy.rb
          if ! git diff --cached --quiet; then
            git commit -m "proxy ${GITHUB_REF_NAME}"
            git push
          fi
